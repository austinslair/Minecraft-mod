name: Build downloadable mod jar

on:
  push:
    branches: [ main, master, work ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-jar:
    name: Build Fabric jar
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Override Gradle for Fabric Loom 1.7.4
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle-8.10.2-bin.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.10.2/bin/gradle --version

      - name: Build remapped Fabric jar
        run: gradle --no-daemon build

      - name: Collect installable jar
        run: |
          mkdir -p release
          cp build/libs/backrooms-level0-*.jar release/
          rm -f release/*-sources.jar release/*-dev.jar
          ls -lah release

      - name: Upload downloadable Minecraft mod jar
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-level0-fabric-1.20.1
          path: release/*.jar
          if-no-files-found: error
