name: Build downloadable mod jar

on:
  push:
    branches: [ main, master, work ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-jar:
    name: Build Fabric jar
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build remapped Fabric jar
        run: gradle --no-daemon build

      - name: Collect installable jar
        run: |
          mkdir -p release
          cp build/libs/backrooms-level0-*.jar release/
          rm -f release/*-sources.jar release/*-dev.jar
          ls -lah release

      - name: Upload downloadable Minecraft mod jar
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-level0-fabric-1.20.1
          path: release/*.jar
          if-no-files-found: error
