buildscript {
    repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral(); gradlePluginPortal() }
    dependencies { classpath 'net.fabricmc:fabric-loom:1.7.4' }
}
apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
loom { splitEnvironmentSourceSets(); mods { backrooms_level0 { sourceSet sourceSets.main; sourceSet sourceSets.client } } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': inputs.properties.version } }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
